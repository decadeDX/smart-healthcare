spring:
  application:
    name: smart-healthcare

  security:
    user:
      name: ${HOSPITAL_ADMIN_USERNAME}
      password: ${HOSPITAL_ADMIN_PASSWORD}
      roles: HOSPITAL_ADMIN

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hospital_sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s

mybatis-plus:
  type-aliases-package: io.github.decadedx.smarthealthcare.entity
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

hospital:
  cache:
    doctor-schedule-ttl: ${DOCTOR_SCHEDULE_CACHE_TTL:24h}
    doctor-schedule-lock-ttl: ${DOCTOR_SCHEDULE_LOCK_TTL:5s}
