openapi: 3.0.3
info:
  title: 智慧医疗多院区挂号与号源调度系统 API
  version: 1.0.0
  description: |
    本规范覆盖本期的挂号详情查询、医生排班查询和院办排班余量调整接口。
    所有响应均使用 Result<T> 包装：成功时 data 为业务 VO，失败时 data 为 null 并包含 traceId。
    认证协议、令牌格式和具体错误码枚举尚未确定，未在本规范中虚构 security scheme 或错误码值。
servers:
  - url: http://localhost:8080
    description: 本地开发环境（请按实际部署地址配置 Apifox 环境）
tags:
  - name: 挂号单
    description: 患者挂号单详情查询
  - name: 医生排班
    description: 患者端医生排班和号源查询
  - name: 排班管理
    description: 院办后台排班余量调整
paths:
  /api/appointments/{appointmentId}:
    get:
      tags: [挂号单]
      summary: 查询挂号单全链路详情
      description: |
        仅允许挂号患者本人或院办后台访问。鉴权机制待接入。
        响应为从挂号单向下展开的有限 VO 树，不包含 appointments、schedules、departments 等反向集合字段。
      operationId: getAppointmentDetail
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: 查询成功；未生成病历时 data.medicalRecord 为 null。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetailResult'
              example:
                code: SUCCESS_CODE_TBD
                message: success
                data:
                  id: 1
                  status: BOOKED
                  patient:
                    id: 1
                    realName: 张三
                  schedule:
                    id: 1
                    workDate: '2023-12-01'
                    timeSlot: 上午
                    capacity: 50
                    doctor:
                      id: 1
                      name: 钟南
                      title: 主任医师
                      department:
                        id: 1
                        name: 呼吸内科
                        campus:
                          id: 1
                          name: 本部院区
                          address: 市中心中山路1号
                        director:
                          id: 1
                          name: 钟南
                          title: 主任医师
                  medicalRecord:
                    id: 1
                    diagnosis: 上呼吸道感染
                    prescription: 阿莫西林
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          $ref: '#/components/responses/AppointmentNotFound'
        '500':
          $ref: '#/components/responses/DataIntegrityError'
  /api/doctors/{doctorId}/schedules:
    get:
      tags: [医生排班]
      summary: 查询医生排班号源
      description: |
        返回医生摘要和按 workDate ASC、timeSlot ASC、id ASC 排序的排班列表。
        缓存命中时不访问数据库；缓存值为 DoctorScheduleVO 的可读 JSON 数据，不包含 Result 外层包装。
      operationId: getDoctorSchedules
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200':
          description: 查询成功；医生存在但无排班时 data.schedules 返回空数组。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorScheduleResult'
              example:
                code: SUCCESS_CODE_TBD
                message: success
                data:
                  doctor:
                    id: 1
                    name: 钟南
                    title: 主任医师
                  schedules:
                    - id: 1
                      workDate: '2023-12-01'
                      timeSlot: 上午
                      capacity: 50
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          $ref: '#/components/responses/DoctorNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/schedules/{scheduleId}/capacity:
    patch:
      tags: [排班管理]
      summary: 调整排班余量或执行紧急停诊
      description: |
        仅允许院办后台访问，认证与角色编码待接入。
        当前表结构没有独立排班状态；传入 capacity: 0 表示紧急停诊。数据库事务提交成功后，必须成功删除对应 doctorId 的排班缓存，接口才可返回 200。
      operationId: updateScheduleCapacity
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCapacityUpdateDTO'
            example:
              capacity: 0
      responses:
        '200':
          description: 数据库已更新且对应医生缓存已成功失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleCapacityUpdateResult'
              example:
                code: SUCCESS_CODE_TBD
                message: success
                data:
                  id: 1
                  doctorId: 1
                  workDate: '2023-12-01'
                  timeSlot: 上午
                  capacity: 0
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          $ref: '#/components/responses/ScheduleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/CacheUnavailable'
components:
  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      description: 挂号单 ID，必须为正整数。
      schema:
        type: integer
        format: int32
        minimum: 1
    DoctorId:
      name: doctorId
      in: path
      required: true
      description: 医生 ID，必须为正整数。
      schema:
        type: integer
        format: int32
        minimum: 1
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: 排班 ID，必须为正整数。
      schema:
        type: integer
        format: int32
        minimum: 1
  responses:
    InvalidParameter:
      description: 路径 ID 非法，或 capacity 缺失、非整数或为负数。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    AppointmentNotFound:
      description: 挂号单不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    DoctorNotFound:
      description: 医生不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    ScheduleNotFound:
      description: 排班不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    DataIntegrityError:
      description: 挂号单的关键关联数据缺失；服务端已记录告警。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    InternalError:
      description: 数据库读取或更新、响应组装或缓存协调发生服务端内部错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    CacheUnavailable:
      description: Redis 不可用，或缓存删除、读写协调在有限重试后仍未完成；本次后台操作不得视为成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
  schemas:
    AppointmentDetailResult:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          description: 项目统一成功码；具体值待统一错误码注册表确定。
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AppointmentDetailVO'
    DoctorScheduleResult:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          description: 项目统一成功码；具体值待统一错误码注册表确定。
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/DoctorScheduleVO'
    ScheduleCapacityUpdateResult:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          description: 项目统一成功码；具体值待统一错误码注册表确定。
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/ScheduleCapacityUpdateVO'
    ErrorResult:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: string
          description: 项目统一错误码；具体值待统一错误码注册表确定。
        message:
          type: string
          description: 面向调用方的错误说明，不得包含内部实现或敏感信息。
        data:
          type: object
          nullable: true
          description: 失败时固定为 null。
        traceId:
          type: string
          description: 请求链路追踪标识。
      example:
        code: ERROR_CODE_TBD
        message: 请求处理失败
        data: null
        traceId: 6d486c3d7e8c4c5a
    AppointmentDetailVO:
      type: object
      required: [id, status, patient, schedule, medicalRecord]
      properties:
        id:
          type: integer
          format: int32
          description: 挂号单 ID。
        status:
          type: string
          enum: [BOOKED, CANCELLED, VISITED]
          description: 挂号单状态。
        patient:
          $ref: '#/components/schemas/PatientSummaryVO'
        schedule:
          $ref: '#/components/schemas/ScheduleDetailVO'
        medicalRecord:
          type: object
          allOf:
            - $ref: '#/components/schemas/MedicalRecordDetailVO'
          nullable: true
          description: 尚未产生病历时为 null。
    PatientSummaryVO:
      type: object
      required: [id, realName]
      properties:
        id:
          type: integer
          format: int32
        realName:
          type: string
          description: 患者真实姓名；不返回身份证号。
    ScheduleDetailVO:
      type: object
      required: [id, workDate, timeSlot, capacity, doctor]
      properties:
        id:
          type: integer
          format: int32
        workDate:
          type: string
          format: date
        timeSlot:
          type: string
          description: 数据库存储的中文时段值，例如上午或下午。
        capacity:
          type: integer
          format: int32
          minimum: 0
        doctor:
          $ref: '#/components/schemas/DoctorDetailVO'
    DoctorDetailVO:
      type: object
      required: [id, name, title, department]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
        department:
          $ref: '#/components/schemas/DepartmentDetailVO'
    DepartmentDetailVO:
      type: object
      required: [id, name, campus, director]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        campus:
          $ref: '#/components/schemas/CampusSummaryVO'
        director:
          $ref: '#/components/schemas/DoctorSummaryVO'
    CampusSummaryVO:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        address:
          type: string
    DoctorSummaryVO:
      type: object
      required: [id, name, title]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        title:
          type: string
    MedicalRecordDetailVO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        diagnosis:
          type: string
          nullable: true
        prescription:
          type: string
          nullable: true
    DoctorScheduleVO:
      type: object
      required: [doctor, schedules]
      properties:
        doctor:
          $ref: '#/components/schemas/DoctorSummaryVO'
        schedules:
          type: array
          description: 按 workDate ASC、timeSlot ASC、id ASC 排序。
          items:
            $ref: '#/components/schemas/ScheduleSummaryVO'
    ScheduleSummaryVO:
      type: object
      required: [id, workDate, timeSlot, capacity]
      properties:
        id:
          type: integer
          format: int32
        workDate:
          type: string
          format: date
        timeSlot:
          type: string
        capacity:
          type: integer
          format: int32
          minimum: 0
    ScheduleCapacityUpdateVO:
      type: object
      required: [id, doctorId, workDate, timeSlot, capacity]
      properties:
        id:
          type: integer
          format: int32
        doctorId:
          type: integer
          format: int32
        workDate:
          type: string
          format: date
        timeSlot:
          type: string
        capacity:
          type: integer
          format: int32
          minimum: 0
    ScheduleCapacityUpdateDTO:
      type: object
      required: [capacity]
      properties:
        capacity:
          type: integer
          format: int32
          minimum: 0
          description: 更新后的剩余号源数；0 表示紧急停诊。
